[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winpodx"
version = "0.12.1"
description = "Windows app integration for Linux desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kim DaeHyun", email = "kernalix7@kodenet.io" },
]
keywords = ["windows", "linux", "desktop-integration", "rdp", "winapps"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    # No per-minor classifiers: the hatchling shipped by Debian 12 / Ubuntu
    # 24.04 validates against its own trove list and rejects ":: 3.13" and
    # newer, which fails the distro .deb build. requires-python is the
    # authoritative declaration of the supported range.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]

dependencies = [
    # tomllib is stdlib on Python 3.11+; pull in the pure-Python tomli fallback
    # for 3.10 (winpodx's minimum) so that interpreter can read TOML without
    # the stdlib module.
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5,<7.0",
]
docker = [
    "docker>=7.0,<8.0",
]
# Reverse-open (#48) icon conversion. Pillow handles raster (PNG/XPM)
# → multi-resolution ICO; cairosvg handles SVG → PNG; pyxdg drives the
# freedesktop icon-theme lookup. Without this extra installed, the
# discovery layer still works but ICO conversion falls back to a
# logged warning + no file written.
reverse-open = [
    "Pillow>=12.3,<13.0",
    "cairosvg>=2.9,<3.0",
    "pyxdg>=0.27,<1.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    # `pytest tests/ -n auto`. Safe to shard only because the autouse fixture
    # in tests/conftest.py gives every test its own HOME + XDG_* tmp dir.
    "pytest-xdist>=3.0,<4.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
    "pip-audit>=2.7",
    "Pillow>=12.3,<13.0",
]
all = [
    "winpodx[gui,docker,reverse-open,dev]",
]

[project.scripts]
winpodx = "winpodx.cli.main:cli"

[project.urls]
Homepage = "https://github.com/kernalix7/winpodx"
Repository = "https://github.com/kernalix7/winpodx"
Issues = "https://github.com/kernalix7/winpodx/issues"
Funding = "https://ko-fi.com/kernalix7"
"Funding (KR)" = "https://fairy.hada.io/@kernalix7"

[tool.hatch.build.targets.wheel]
packages = ["src/winpodx"]
# Hatchling matches shared-data files against exclude patterns by their
# *destination* path (share/winpodx/...), so the patterns below are written
# against that layout. They keep rebuild-only material out of the runtime
# payload while the sdist (default full VCS tree) retains every source:
# - the shim ships pre-built under shim/bin/ (plus its notices); the Rust
#   rebuild sources (Cargo.toml/build.rs/src/, regenerable target/) and
#   Cargo.lock stay sdist-only;
# - scripts/ci and gen_web_i18n.py are dev/CI helpers, not guest payload.
# Unknown future notice files (LICENSE*/NOTICE*/build-provenance*) under the
# shim are NOT excluded — only the exact rebuild sources are.
exclude = [
    "share/winpodx/config/oem/reverse-open/shim/.gitignore",
    "share/winpodx/config/oem/reverse-open/shim/Cargo.toml",
    "share/winpodx/config/oem/reverse-open/shim/Cargo.lock",
    "share/winpodx/config/oem/reverse-open/shim/build.rs",
    "share/winpodx/config/oem/reverse-open/shim/src",
    "share/winpodx/config/oem/reverse-open/shim/src/**",
    "share/winpodx/config/oem/reverse-open/shim/target",
    "share/winpodx/config/oem/reverse-open/shim/target/**",
    "share/winpodx/scripts/ci",
    "share/winpodx/scripts/ci/**",
    "share/winpodx/scripts/gen_web_i18n.py",
]

[tool.hatch.build.targets.wheel.shared-data]
"data" = "share/winpodx/data"
"config" = "share/winpodx/config"
# Guest scripts only: scripts/ci + gen_web_i18n.py are dev/CI helpers and stay
# out of the wheel (the excludes above guard a future re-broadening).
"scripts/windows" = "share/winpodx/scripts/windows"
# QEMU disguise build recipe (five source files, never a patched binary or
# image) so `winpodx disguise build-image` works from an installed copy.
"packaging/qemu-disguise" = "share/winpodx/packaging/qemu-disguise"
"uninstall.sh" = "share/winpodx/uninstall.sh"
"LICENSE" = "share/winpodx/LICENSE"
"README.md" = "share/winpodx/README.md"
"THIRD_PARTY_LICENSES.md" = "share/winpodx/THIRD_PARTY_LICENSES.md"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:winpodx.*",
]
markers = [
    "hypothesis: property-based tests using the Hypothesis library (skipped if hypothesis is not installed)",
]
